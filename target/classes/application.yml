spring:
  application:
    name: network-monitoring
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/network_monitoring}
    username: ${DB_USERNAME:network_user}
    password: ${DB_PASSWORD:network_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  cache:
    type: redis
